name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      # scripts/pdf.ts relies on Node's built-in TypeScript type stripping.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test

      # Builds the site and prints dist/resume.pdf with the runner's Chrome.
      - run: bun run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
