<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- lang, title, favicon and search metadata come from assets/ at build time -->
    <title>Resume</title>
    <script>
      // Dark theme before the first paint, so the page never flashes light.
      // Mirrors src/web/features/theme/model.ts, which stores the choice as
      // reatom's withLocalStorage("resume.theme") record.
      try {
        const saved = JSON.parse(localStorage.getItem("resume.theme") || "null")
        const theme = saved?.data
        if (
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark")
        }
      } catch {
        // No storage (private mode) or a broken record: keep the light theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/app/main.tsx"></script>
  </body>
</html>
