pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,html}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: bun run typecheck
    - name: knip
      glob: "*.{ts,tsx,json,jsonc}"
      run: bun run knip

pre-push:
  jobs:
    - name: ci
      run: bun run ci
